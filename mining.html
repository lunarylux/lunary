<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunary (LUX) — Mining</title>
<link rel="icon" type="image/png" href="https://lunary.xyz/asset/lunary.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-1: #0a0a1a; --bg-2: #1a1a3a;
    --card: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.08);
    --primary: #a78bfa; --secondary: #60a5fa;
    --gold: #fbbf24; --gold-2: #f59e0b;
    --danger: #ef4444; --success: #34d399;
    --text: #fff; --muted: #888;
  }
  html, body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-1); color: var(--text);
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(1200px 800px at 20% 0%, rgba(167,139,250,0.18), transparent 60%),
      radial-gradient(1000px 700px at 100% 100%, rgba(96,165,250,0.15), transparent 60%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    z-index: -2;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 80% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 40% 70%, #fff, transparent),
      radial-gradient(1px 1px at 60% 10%, #fff, transparent),
      radial-gradient(1px 1px at 25% 85%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 75%, #fff, transparent);
    opacity: 0.35; z-index: -1;
    animation: twinkle 8s infinite alternate;
  }
  @keyframes twinkle { from{opacity:.2} to{opacity:.5} }
  .container { max-width: 520px; width: 100%; margin: 0 auto; padding: 28px 20px 60px; }
  .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .logo-wrap { position: relative; width: 96px; height: 96px; margin-bottom: 14px; }
  .logo-wrap::before {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--primary), var(--secondary), var(--primary));
    filter: blur(14px); opacity: 0.55; animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo {
    position: relative; width: 96px; height: 96px; border-radius: 50%;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
    object-fit: cover; display: block;
  }
  .logo-fallback {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 44px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #2a2a4a, #0a0a1a);
  }
  h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tagline {
    font-size: 12px; color: var(--muted); margin-top: 4px;
    letter-spacing: 1.5px; text-transform: uppercase;
  }
  .card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 18px; padding: 18px 20px; margin-bottom: 14px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; font-size: 14px;
  }
  .row + .row { border-top: 1px solid rgba(255,255,255,0.04); }
  .label { color: var(--muted); }
  .value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .value.gold {
    background: linear-gradient(90deg, var(--gold), var(--gold-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .timer-card { text-align: center; padding: 26px 20px; }
  #timer {
    font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px; min-height: 52px;
  }
  #timerLabel {
    font-size: 11px; color: var(--muted); letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .progress-wrap {
    margin-top: 16px; height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 100px; overflow: hidden;
  }
  #progressBar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    border-radius: 100px; transition: width 0.5s ease;
    box-shadow: 0 0 12px rgba(167,139,250,0.6);
  }
  .pow-info {
    font-size: 11px; color: var(--muted); margin-top: 10px;
    font-variant-numeric: tabular-nums; min-height: 16px;
  }
  button {
    width: 100%; padding: 16px; font-size: 15px; font-weight: 700;
    border-radius: 14px; border: none; cursor: pointer; margin-bottom: 10px;
    transition: transform 0.15s, box-shadow 0.2s, background 0.3s;
    font-family: inherit; letter-spacing: 0.3px;
  }
  button:not(:disabled):hover { transform: translateY(-1px); }
  button:disabled { cursor: not-allowed; }
  #connectBtn {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff; border: none; margin-bottom: 16px;
    box-shadow: 0 6px 20px rgba(167,139,250,0.35);
  }
  #startBtn {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff; box-shadow: 0 6px 20px rgba(167,139,250,0.35);
  }
  #startBtn:disabled {
    background: rgba(255,255,255,0.05); color: #555; box-shadow: none;
  }
  #claimBtn {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #1a1a2e; box-shadow: 0 6px 20px rgba(251,191,36,0.3);
  }
  #claimBtn:disabled {
    background: rgba(255,255,255,0.05); color: #555; box-shadow: none;
  }
  #status {
    text-align: center; font-size: 13px; color: #bbb;
    padding: 14px; background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px; margin-top: 4px;
    transition: color 0.3s; word-break: break-word; line-height: 1.5;
  }
  #status.success { color: var(--success); border-color: rgba(52,211,153,0.3); }
  #status.error { color: var(--danger); border-color: rgba(239,68,68,0.3); }
  #status.info { color: var(--secondary); border-color: rgba(96,165,250,0.3); }
  .footer { text-align: center; font-size: 11px; color: #555; margin-top: 24px; }
  .footer a { color: var(--primary); text-decoration: none; }
  .hidden { display: none !important; }
  .network-warn {
    text-align: center; font-size: 12px; color: #fbbf24;
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 10px; padding: 10px; margin-bottom: 12px;
  }
  .network-warn button {
    margin-top: 8px; margin-bottom: 0; padding: 10px 14px;
    font-size: 13px; width: auto; display: inline-block;
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #1a1a2e;
  }
  @media (max-width: 400px) {
    #timer { font-size: 36px; }
    h1 { font-size: 26px; }
    .logo, .logo-wrap { width: 80px; height: 80px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="logo-wrap">
      <div class="logo-fallback">🌙</div>
      <img id="logo" class="logo" src="https://lunary.xyz/asset/lunary.png"
           alt="Lunary Logo" onerror="this.style.display='none';" />
    </div>
    <h1>Lunary</h1>
    <div class="tagline">LUX · PoW Mining · 4× Halving</div>
  </div>

  <div id="networkWarn" class="network-warn hidden">
    ⚠️ Jaringan salah. Silakan switch ke <b>Sepolia Testnet</b>.
    <br>
    <button id="switchNetBtn" type="button">🔁 Switch ke Sepolia</button>
  </div>

  <button id="connectBtn" type="button">🔌 Connect Wallet</button>

  <div class="card hidden" id="statsCard">
    <div class="row">
      <span class="label">Wallet</span>
      <span class="value" id="wallet">-</span>
    </div>
    <div class="row">
      <span class="label">Saldo LUX</span>
      <span class="value gold" id="luxBal">-</span>
    </div>
    <div class="row">
      <span class="label">Reward saat ini</span>
      <span class="value gold" id="reward">-</span>
    </div>
    <div class="row">
      <span class="label">Epoch</span>
      <span class="value" id="epoch">-</span>
    </div>
    <div class="row">
      <span class="label">Total mined</span>
      <span class="value" id="mined">-</span>
    </div>
    <div class="row">
      <span class="label">Max supply</span>
      <span class="value" id="maxSupply">-</span>
    </div>
  </div>

  <div class="card timer-card hidden" id="miningCard">
    <div id="timer">--:--:--</div>
    <div id="timerLabel">Waktu mining</div>

    <div class="progress-wrap">
      <div id="progressBar"></div>
    </div>
    <div class="pow-info" id="powProgress">PoW: idle</div>

    <div style="margin-top:20px;">
      <button id="startBtn" type="button" disabled>▶️ Mulai Mining</button>
      <button id="claimBtn" type="button" disabled>💰 Claim Reward</button>
    </div>
  </div>

  <div id="status">Menunggu...</div>

  <div class="footer">
    © 2025 Lunary · <a href="https://lunary.xyz" target="_blank">lunary.xyz</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.1/ethers.umd.min.js"></script>
<script>
// ==================================================
// WRAPPER: Tangkap semua error supaya UI tetap hidup
// ==================================================
window.addEventListener("error", function(e) {
  console.error("Global error:", e.message, e.filename, e.lineno);
  var st = document.getElementById("status");
  if (st) {
    st.className = "error";
    st.innerText = "⚠️ Script error: " + e.message + " (baris " + e.lineno + ")";
  }
});

// ==================================================
// KONFIGURASI
// ==================================================
var CONTRACT_ADDRESS = "0xb5D36A387BB75FbE69A15bf72C24998D8353a066";
var SEPOLIA_CHAIN_ID_HEX = "0xaa36a7";
var SEPOLIA_CHAIN_ID_DEC = 11155111;
var MINING_DURATION = 4 * 3600;
var SITE_URL = "https://lunarylux.github.io";

var ABI = [
  "function name() view returns (string)",
  "function symbol() view returns (string)",
  "function decimals() view returns (uint8)",
  "function totalSupply() view returns (uint256)",
  "function balanceOf(address) view returns (uint256)",
  "function MAX_SUPPLY() view returns (uint256)",
  "function startMining(bytes32 clientSeed)",
  "function claim(uint256 nonce)",
  "function cancelMining()",
  "function sessions(address) view returns (uint256 startTime, bytes32 challenge, bool active, bool claimed)",
  "function canClaim(address) view returns (bool)",
  "function timeRemaining(address) view returns (uint256)",
  "function currentReward() view returns (uint256)",
  "function currentEpoch() view returns (uint256)",
  "function totalMined() view returns (uint256)",
  "function totalClaims() view returns (uint256)",
  "function DIFFICULTY() view returns (uint256)",
  "function MINING_DURATION() view returns (uint256)",
  "event MiningStarted(address indexed user, uint256 startTime, bytes32 challenge)",
  "event MiningClaimed(address indexed user, uint256 reward, uint256 epoch)"
];

// ==================================================
// STATE
// ==================================================
var provider = null;
var signer = null;
var contract = null;
var userAddress = null;
var timerInterval = null;
var foundNonce = null;
var powRunning = false;
var cachedChallenge = null;
var cachedDifficulty = 100000n;
var isWorking = false;
var isConnecting = false;
var ethersReady = false;

// ==================================================
// HELPERS (pakai function declaration, bukan arrow)
// ==================================================
function $(id) { return document.getElementById(id); }

function shortAddr(a) {
  if (!a) return "—";
  return a.slice(0, 6) + "..." + a.slice(-4);
}
function p2(n) { return String(n).padStart(2, "0"); }

function fmtLUX(v) {
  try {
    if (typeof ethers === "undefined") return v.toString();
    var s = ethers.utils.formatUnits(v, 8);
    var n = Number(s);
    if (!isFinite(n)) return s;
    return n.toLocaleString("id-ID", { maximumFractionDigits: 8 });
  } catch (e) { return String(v); }
}

function setStatus(msg, type) {
  type = type || "";
  var el = $("status");
  if (!el) return;
  el.innerHTML = msg;
  el.className = type;
}

function setProgress(pct) {
  var el = $("progressBar");
  if (el) el.style.width = Math.max(0, Math.min(100, pct)) + "%";
}

function setPowInfo(msg) {
  var el = $("powProgress");
  if (el) el.innerText = msg;
}

function decodeError(e) {
  if (!e) return "Unknown error";
  if (typeof e === "string") return e;
  if (e.reason) return e.reason;
  var data = e.data || (e.error && e.error.data) || (e.error && e.error.error && e.error.error.data);
  if (typeof data === "string" && data.indexOf("0x08c379a0") === 0) {
    try {
      return ethers.utils.defaultAbiCoder.decode(["string"], "0x" + data.slice(10))[0];
    } catch (x) {}
  }
  if (typeof data === "string" && data.indexOf("0x4e487b71") === 0) {
    var code = parseInt(data.slice(10, 74), 16);
    return "Panic 0x" + code.toString(16);
  }
  if (e.message) return e.message;
  if (e.error && e.error.message) return e.error.message;
  return "Transaction reverted";
}

function isMobile() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

function hasInjectedWallet() {
  return typeof window.ethereum !== "undefined";
}

// ==================================================
// CEK KETERSEDIAAN WALLET
// ==================================================
function checkWalletAvailability() {
  if (hasInjectedWallet()) {
    return { ok: true };
  }
  if (isMobile()) {
    var dappUrl = SITE_URL.replace(/^https?:\/\//, "");
    return {
      ok: false,
      html: '❌ Wallet tidak terdeteksi di browser ini.<br><br>' +
        '<b>Solusi:</b> Buka halaman ini di <b>MetaMask Browser</b>.<br><br>' +
        '<a href="https://metamask.app.link/dapp/' + dappUrl + '" ' +
        'style="display:inline-block;padding:10px 16px;background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#fff;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px;">' +
        '🦊 Buka di MetaMask</a>' +
        '<br><br><span style="font-size:11px;color:#888;">Atau install MetaMask dari Play Store / App Store.</span>'
    };
  }
  return {
    ok: false,
    html: '❌ MetaMask tidak terdeteksi.<br><br>' +
      'Install ekstensi MetaMask di browser kamu:<br>' +
      '<a href="https://metamask.io/download/" target="_blank" ' +
      'style="display:inline-block;padding:10px 16px;background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#fff;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px;">' +
      '⬇️ Download MetaMask</a>'
  };
}

// ==================================================
// SWITCH / ADD SEPOLIA
// ==================================================
async function ensureSepolia() {
  if (!window.ethereum) throw new Error("MetaMask tidak terdeteksi");
  var current = await window.ethereum.request({ method: "eth_chainId" });
  if (current.toLowerCase() === SEPOLIA_CHAIN_ID_HEX.toLowerCase()) return true;

  try {
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: SEPOLIA_CHAIN_ID_HEX }]
    });
  } catch (err) {
    if (err.code === 4902 || err.code === -32603) {
      try {
        await window.ethereum.request({
          method: "wallet_addEthereumChain",
          params: [{
            chainId: SEPOLIA_CHAIN_ID_HEX,
            chainName: "Sepolia Testnet",
            nativeCurrency: { name: "Sepolia ETH", symbol: "ETH", decimals: 18 },
            rpcUrls: ["https://rpc.sepolia.org", "https://sepolia.drpc.org"],
            blockExplorerUrls: ["https://sepolia.etherscan.io"]
          }]
        });
      } catch (addErr) {
        if (addErr.code === 4001) throw new Error("Kamu menolak menambahkan Sepolia");
        throw new Error("Gagal tambah Sepolia: " + (addErr.message || addErr));
      }
    } else if (err.code === 4001) {
      throw new Error("Kamu menolak switch ke Sepolia");
    } else {
      throw new Error("Gagal switch: " + (err.message || err));
    }
  }

  var start = Date.now();
  while (Date.now() - start < 5000) {
    var c = await window.ethereum.request({ method: "eth_chainId" });
    if (c.toLowerCase() === SEPOLIA_CHAIN_ID_HEX.toLowerCase()) return true;
    await new Promise(function(r) { setTimeout(r, 200); });
  }
  throw new Error("Timeout: MetaMask tidak pindah ke Sepolia");
}

// ==================================================
// CONNECT CORE
// ==================================================
async function doConnect() {
  if (isConnecting) return;
  isConnecting = true;
  try {
    // cek ethers loaded
    if (typeof ethers === "undefined") {
      setStatus("❌ Library ethers gagal dimuat. Cek koneksi internet & reload.", "error");
      return;
    }

    // cek wallet
    var check = checkWalletAvailability();
    if (!check.ok) {
      setStatus(check.html, "error");
      return;
    }

    setStatus("🔓 Meminta akses akun...", "info");
    var accounts;
    try {
      accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    } catch (accErr) {
      if (accErr.code === 4001) {
        setStatus("❌ Kamu menolak permintaan koneksi.", "error");
        return;
      }
      throw accErr;
    }

    if (!accounts || accounts.length === 0) {
      setStatus("❌ Tidak ada akun terdeteksi.", "error");
      return;
    }
    userAddress = accounts[0];

    // cek chain
    var chainId = await window.ethereum.request({ method: "eth_chainId" });
    if (chainId.toLowerCase() !== SEPOLIA_CHAIN_ID_HEX.toLowerCase()) {
      $("networkWarn").classList.remove("hidden");
      setStatus("⚠️ Jaringan salah. Klik tombol <b>Switch ke Sepolia</b> di atas.", "error");
      return;
    }
    $("networkWarn").classList.add("hidden");

    // buat provider
    provider = new ethers.providers.Web3Provider(window.ethereum, "any");
    signer = provider.getSigner();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);

    // cek kontrak ada
    setStatus("🔍 Memeriksa kontrak...", "info");
    var code = await provider.getCode(CONTRACT_ADDRESS);
    if (!code || code === "0x") {
      setStatus("❌ Tidak ada kontrak di alamat ini di Sepolia.", "error");
      return;
    }

    // ambil difficulty
    try {
      var d = await contract.DIFFICULTY();
      cachedDifficulty = BigInt(d.toString());
    } catch (x) {
      cachedDifficulty = 100000n;
    }

    // update UI
    $("wallet").innerText = shortAddr(userAddress);
    $("connectBtn").style.display = "none";
    $("statsCard").classList.remove("hidden");
    $("miningCard").classList.remove("hidden");
    setStatus("✅ Connected", "success");

    await updateUI();

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(function() {
      updateTimer().catch(function(e) { console.error("timer:", e); });
    }, 1000);

  } catch (e) {
    console.error("Connect error:", e);
    var msg = decodeError(e);
    if (msg.toLowerCase().indexOf("user rejected") >= 0 || msg.toLowerCase().indexOf("user denied") >= 0) {
      setStatus("❌ Kamu menolak permintaan koneksi.", "error");
    } else {
      setStatus("❌ " + msg, "error");
    }
  } finally {
    isConnecting = false;
  }
}

// ==================================================
// UPDATE UI
// ==================================================
async function updateUI() {
  if (!contract || !userAddress) return;
  try {
    var results = await Promise.all([
      contract.currentReward(),
      contract.currentEpoch(),
      contract.totalMined(),
      contract.MAX_SUPPLY(),
      contract.sessions(userAddress),
      contract.balanceOf(userAddress)
    ]);

    var reward = results[0], epoch = results[1], mined = results[2];
    var maxSupply = results[3], session = results[4], bal = results[5];

    $("reward").innerText = fmtLUX(reward) + " LUX";
    $("epoch").innerText = epoch.toString();
    $("mined").innerText = fmtLUX(mined) + " LUX";
    $("maxSupply").innerText = fmtLUX(maxSupply) + " LUX";
    $("luxBal").innerText = fmtLUX(bal) + " LUX";

    var startBtn = $("startBtn");
    var claimBtn = $("claimBtn");

    if (!session.active && !session.claimed) {
      startBtn.disabled = false;
      startBtn.innerText = "▶️ Mulai Mining";
      claimBtn.disabled = true;
      $("timer").innerText = "--:--:--";
      $("timerLabel").innerText = "Siap memulai";
      setProgress(0);
      setPowInfo("PoW: idle");
      foundNonce = null;
      cachedChallenge = null;
    } else if (session.active && !session.claimed) {
      cachedChallenge = session.challenge;
      var canClaimNow = await contract.canClaim(userAddress);

      if (canClaimNow) {
        startBtn.disabled = true;
        startBtn.innerText = "⛏️ Mining berjalan...";
        claimBtn.disabled = foundNonce === null;
        $("timer").innerText = "✅ Siap Claim";
        $("timerLabel").innerText = foundNonce === null
          ? "Menunggu PoW selesai..."
          : "Klik tombol Claim";
        setProgress(100);
      } else {
        startBtn.disabled = true;
        startBtn.innerText = "⛏️ Mining berjalan...";
        claimBtn.disabled = true;
        $("timerLabel").innerText = "Sisa waktu mining";
        if (foundNonce === null && !powRunning) {
          setPowInfo("PoW: memulai...");
          startPoW(session.challenge);
        }
      }
    } else {
      startBtn.disabled = false;
      startBtn.innerText = "🔄 Mulai Mining Lagi";
      claimBtn.disabled = true;
      $("timer").innerText = "✅ Selesai";
      $("timerLabel").innerText = "Klik Start untuk siklus berikutnya";
      setProgress(100);
    }
  } catch (e) {
    console.error("updateUI error:", e);
  }
}

// ==================================================
// TIMER
// ==================================================
async function updateTimer() {
  if (!contract || !userAddress) return;
  try {
    var session = await contract.sessions(userAddress);
    if (!session.active || session.claimed) return;

    var remaining = await contract.timeRemaining(userAddress);
    var sec = Number(remaining);

    if (sec <= 0) {
      $("timer").innerText = "✅ Siap Claim";
      $("timerLabel").innerText = foundNonce === null
        ? "Menunggu PoW selesai..."
        : "Klik tombol Claim di bawah";
      setProgress(100);
      if (foundNonce !== null) $("claimBtn").disabled = false;
      return;
    }

    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    $("timer").innerText = p2(h) + ":" + p2(m) + ":" + p2(s);

    var elapsed = MINING_DURATION - sec;
    setProgress((elapsed / MINING_DURATION) * 100);
  } catch (e) {
    console.error("updateTimer error:", e);
  }
}

// ==================================================
// PoW BRUTE FORCE
// ==================================================
function startPoW(challenge) {
  if (powRunning || foundNonce !== null) return;
  powRunning = true;

  var MAX_UINT = (1n << 256n) - 1n;
  var target = MAX_UINT / cachedDifficulty;

  var nonce = 0;
  var hashCount = 0;
  var startTime = Date.now();
  var batch = 500;

  function tick() {
    if (foundNonce !== null) { powRunning = false; return; }

    for (var i = 0; i < batch; i++) {
      var hash = ethers.utils.solidityKeccak256(
        ["bytes32", "address", "uint256"],
        [challenge, userAddress, nonce]
      );
      hashCount++;
      if (BigInt(hash) < target) {
        foundNonce = nonce;
        setPowInfo("✅ PoW selesai! Nonce: " + nonce.toLocaleString("id-ID"));
        var cb = $("claimBtn");
        if (cb) cb.disabled = false;
        powRunning = false;
        return;
      }
      nonce++;
    }

    var elapsed = (Date.now() - startTime) / 1000;
    var rate = elapsed > 0 ? Math.round(hashCount / elapsed) : 0;
    setPowInfo(
      "PoW: " + hashCount.toLocaleString("id-ID") + " hash · " +
      rate.toLocaleString("id-ID") + " H/s · nonce " + nonce.toLocaleString("id-ID")
    );
    setTimeout(tick, 0);
  }
  tick();
}

// ==================================================
// START MINING
// ==================================================
async function handleStartMining() {
  if (isWorking) return;
  isWorking = true;
  try {
    setStatus("⏳ Memulai mining...", "info");
    foundNonce = null;
    powRunning = false;
    setPowInfo("PoW: idle");
    setProgress(0);

    var clientSeed = ethers.utils.hexlify(ethers.utils.randomBytes(32));

    try {
      await contract.estimateGas.startMining(clientSeed);
    } catch (estErr) {
      throw new Error("Estimasi gas gagal: " + decodeError(estErr));
    }

    setStatus("⏳ Kirim transaksi...", "info");
    var tx = await contract.startMining(clientSeed);
    setStatus("⏳ Menunggu konfirmasi...", "info");
    var receipt = await tx.wait();

    var challenge = null;
    for (var i = 0; i < receipt.logs.length; i++) {
      try {
        var parsed = contract.interface.parseLog(receipt.logs[i]);
        if (parsed.name === "MiningStarted") {
          challenge = parsed.args.challenge;
          break;
        }
      } catch (x) {}
    }
    if (!challenge) {
      var session = await contract.sessions(userAddress);
      challenge = session.challenge;
    }

    cachedChallenge = challenge;
    setStatus("✅ Mining dimulai! Tunggu 4 jam.", "success");

    await updateUI();

    setPowInfo("PoW: memulai...");
    startPoW(challenge);

  } catch (e) {
    console.error(e);
    setStatus("❌ " + decodeError(e), "error");
  } finally {
    isWorking = false;
  }
}

// ==================================================
// CLAIM
// ==================================================
async function handleClaim() {
  if (isWorking) return;
  if (foundNonce === null) {
    setStatus("⏳ Menunggu PoW selesai...", "error");
    return;
  }
  isWorking = true;
  try {
    setStatus("⏳ Claim...", "info");

    try {
      await contract.estimateGas.claim(foundNonce);
    } catch (estErr) {
      throw new Error("Estimasi gas gagal: " + decodeError(estErr));
    }

    var tx = await contract.claim(foundNonce);
    setStatus("⏳ Menunggu konfirmasi...", "info");
    await tx.wait();

    setStatus("🎉 Berhasil claim LUX! Klik Start untuk siklus berikutnya.", "success");
    foundNonce = null;
    powRunning = false;
    cachedChallenge = null;
    setPowInfo("PoW: idle");
    setProgress(0);

    await updateUI();
  } catch (e) {
    console.error(e);
    setStatus("❌ " + decodeError(e), "error");
  } finally {
    isWorking = false;
  }
}

// ==================================================
// BIND EVENT LISTENERS (dipanggil setelah DOM ready)
// ==================================================
function bindEventListeners() {
  var btn = $("connectBtn");
  if (btn) {
    btn.addEventListener("click", function(e) {
      e.preventDefault();
      console.log("Connect button clicked");
      doConnect();
    });
  } else {
    console.error("connectBtn tidak ditemukan!");
  }

  var sw = $("switchNetBtn");
  if (sw) {
    sw.addEventListener("click", async function(e) {
      e.preventDefault();
      try {
        setStatus("⏳ Switch ke Sepolia...", "info");
        await ensureSepolia();
        await doConnect();
      } catch (err) {
        setStatus("❌ " + decodeError(err), "error");
      }
    });
  }

  var sb = $("startBtn");
  if (sb) {
    sb.addEventListener("click", function(e) {
      e.preventDefault();
      handleStartMining();
    });
  }

  var cb = $("claimBtn");
  if (cb) {
    cb.addEventListener("click", function(e) {
      e.preventDefault();
      handleClaim();
    });
  }
}

// ==================================================
// EVENT WALLET
// ==================================================
function bindWalletListeners() {
  if (!window.ethereum || window.__luxListenersBound) return;
  window.__luxListenersBound = true;

  window.ethereum.on("accountsChanged", function(accs) {
    if (!accs || accs.length === 0) {
      setStatus("🔒 Wallet disconnected", "error");
      $("connectBtn").style.display = "block";
      $("statsCard").classList.add("hidden");
      $("miningCard").classList.add("hidden");
      return;
    }
    doConnect();
  });

  window.ethereum.on("chainChanged", function(hex) {
    var id = parseInt(hex, 16);
    if (id === SEPOLIA_CHAIN_ID_DEC) {
      doConnect();
    } else {
      $("networkWarn").classList.remove("hidden");
      setStatus("⚠️ Pindah dari Sepolia. Klik Switch ke Sepolia.", "error");
    }
  });
}

// ==================================================
// INIT (dipanggil setelah DOM siap)
// ==================================================
async function init() {
  console.log("=== Lunary Mining Init ===");
  console.log("DOM ready");
  console.log("ethers loaded:", typeof ethers !== "undefined");
  console.log("window.ethereum:", typeof window.ethereum);
  console.log("isMobile:", isMobile());

  // bind tombol DULU, sebelum apapun
  bindEventListeners();

  // cek ethers
  if (typeof ethers === "undefined") {
    setStatus("❌ Library ethers gagal dimuat. Cek koneksi internet & reload.", "error");
    return;
  }

  // cek wallet
  if (!hasInjectedWallet()) {
    if (isMobile()) {
      var dappUrl = SITE_URL.replace(/^https?:\/\//, "");
      setStatus(
        '💡 Buka halaman ini di <b>MetaMask Browser</b> untuk connect wallet.<br><br>' +
        '<a href="https://metamask.app.link/dapp/' + dappUrl + '" ' +
        'style="display:inline-block;padding:10px 16px;background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#fff;border-radius:10px;text-decoration:none;font-weight:700;">' +
        '🦊 Buka di MetaMask</a>',
        "info"
      );
    } else {
      setStatus("💡 Install MetaMask untuk connect wallet.", "info");
    }
    return;
  }

  bindWalletListeners();

  // auto reconnect kalau sudah pernah connect
  try {
    var accs = await window.ethereum.request({ method: "eth_accounts" });
    var chain = await window.ethereum.request({ method: "eth_chainId" });

    if (chain.toLowerCase() !== SEPOLIA_CHAIN_ID_HEX.toLowerCase()) {
      $("networkWarn").classList.remove("hidden");
      setStatus("⚠️ Jaringan salah. Klik tombol switch di atas.", "error");
      if (accs && accs.length > 0) userAddress = accs[0];
      return;
    }

    if (accs && accs.length > 0) {
      doConnect();
    } else {
      setStatus("👋 Klik <b>Connect Wallet</b> untuk memulai.", "");
    }
  } catch (e) {
    console.error("Auto reconnect error:", e);
    setStatus("👋 Klik <b>Connect Wallet</b> untuk memulai.", "");
  }
}

// ==================================================
// JALANKAN INIT SETELAH DOM READY
// ==================================================
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
</script>
